# Model-router configuration (Spec 01).
#
# Defines the two-tier model policy (strong / small) plus a zero-cost local
# override tier, and the role -> tier assignment. Secrets are referenced via
# ${ENV_VAR} placeholders only -- never literal keys in this file.
#
# NOTE: prices below are placeholders copied from public provider list prices
# at the time of writing. Verify against the provider's current pricing page
# before relying on cost figures for a real benchmark run.

tiers:
  strong:
    provider: openrouter
    model: openrouter/qwen/qwen-2.5-72b-instruct
    input_price_per_1k: 0.00035
    output_price_per_1k: 0.0004
    api_key_env: OPENROUTER_API_KEY
  small:
    provider: groq
    model: groq/llama-3.1-8b-instant
    input_price_per_1k: 0.00005
    output_price_per_1k: 0.00008
    api_key_env: GROQ_API_KEY
  local:
    provider: ollama
    model: ollama/llama3.1
    input_price_per_1k: 0.0
    output_price_per_1k: 0.0
    api_base: ${OLLAMA_BASE_URL}

roles:
  architect: strong
  reviewer: strong
  developer: small
  tester: small
