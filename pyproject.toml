[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-swe-benchmark"
version = "0.1.0"
description = "Benchmarks single-agent vs. multi-agent LLM performance on SWE-bench coding tasks."
requires-python = ">=3.11"
authors = [{ name = "Rahul" }]
dependencies = [
    "langgraph==1.2.7",
    "litellm==1.90.2",
    "psycopg2-binary==2.9.12",
    "streamlit==1.58.0",
    "python-dotenv==1.2.2",
    "docker==7.1.0",
    "pyyaml==6.0.3",
    "mcp==1.28.1",
    "sb-cli==0.1.5",
    "langgraph-checkpoint-sqlite==3.1.0",
    "pandas==3.0.3",
    "datasets==5.0.1",
    "altair==6.2.2",
    "tabulate==0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.20",
    "black==26.5.1",
    "mypy==2.1.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires Docker/Postgres",
    "anyio: async tests run under the anyio pytest plugin",
]
