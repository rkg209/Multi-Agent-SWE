[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-swe-benchmark"
version = "0.1.0"
description = "Benchmarks single-agent vs. multi-agent LLM performance on SWE-bench coding tasks."
requires-python = ">=3.11"
authors = [{ name = "Rahul" }]
dependencies = [
    "langgraph>=0.2.0",
    "litellm>=1.40.0",
    "psycopg2-binary>=2.9.9",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.0",
    "docker>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires Docker/Postgres"]
